<script>
(() => {
  const pages = [...document.querySelectorAll('.page')];
  const current = document.getElementById('current');
  let index = 0;
  const show = next => {
    index = Math.max(0, Math.min(pages.length - 1, next));
    pages[index].scrollIntoView({behavior:'auto',block:'start'});
  };
  const observer = new IntersectionObserver(entries => {
    const visible = entries
      .filter(entry => entry.isIntersecting)
      .sort((a,b) => b.intersectionRatio - a.intersectionRatio)[0];
    if (!visible) return;
    index = Number(visible.target.dataset.page) - 1;
    current.textContent = String(index + 1).padStart(2,'0');
  }, {threshold:[0.55,0.75]});
  pages.forEach(page => observer.observe(page));
  addEventListener('keydown', event => {
    if (['ArrowRight','ArrowDown','PageDown',' '].includes(event.key)) {
      event.preventDefault(); show(index + 1);
    } else if (['ArrowLeft','ArrowUp','PageUp'].includes(event.key)) {
      event.preventDefault(); show(index - 1);
    } else if (event.key === 'Home') {
      event.preventDefault(); show(0);
    } else if (event.key === 'End') {
      event.preventDefault(); show(pages.length - 1);
    }
  });
})();
</script>
